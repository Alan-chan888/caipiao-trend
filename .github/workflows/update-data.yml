name: Update Lottery Data

# 注意: webapi.sporttery.cn 对海外 IP 有访问限制(Cloudflare 520),
# GitHub Actions 的海外 runner 抓取会失败, 故停用定时 schedule.
# "持续更新"由本机 launchd 定时任务(update.sh)完成.
# 此 workflow 仅保留手动触发(workflow_dispatch)作为应急备份.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch lottery data
        run: python3 fetch_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/qxc.json data/pl5.json
          if git diff --cached --quiet; then
            echo "数据无变化, 跳过提交"
          else
            git commit -m "chore: 更新开奖数据 $(date -u +%F)"
            git push
          fi
