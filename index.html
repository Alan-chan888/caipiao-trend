<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体彩规律图 · 七星彩 & 排列五</title>
  <meta name="description" content="中国体育彩票七星彩、排列五走势图与规律分析，数据每日自动更新">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎯</span>
      <div class="brand-text">
        <h1>体彩规律图</h1>
        <p>七星彩 · 排列五 走势图</p>
      </div>
    </div>
    <div class="topbar-meta">
      <span id="updatedAt" class="updated">加载中…</span>
    </div>
  </header>

  <nav class="tabs" id="gameTabs">
    <button class="tab active" data-game="qxc">七星彩</button>
    <button class="tab" data-game="pl5">排列五</button>
  </nav>

  <!-- 最新一期摘要 -->
  <section class="latest-card" id="latestCard">
    <div class="latest-head">
      <span class="latest-label">最新一期</span>
      <span class="latest-num" id="latestNum">—</span>
      <span class="latest-date" id="latestDate">—</span>
    </div>
    <div class="latest-balls" id="latestBalls"></div>
  </section>

  <!-- 控制栏 -->
  <section class="controls">
    <div class="control-group">
      <span class="control-label">显示期数</span>
      <div class="seg" id="rangeSeg">
        <button data-range="30">近30期</button>
        <button data-range="50">近50期</button>
        <button data-range="100" class="active">近100期</button>
        <button data-range="200">近200期</button>
      </div>
    </div>
  </section>

  <!-- 走势图 -->
  <section class="panel" id="trendPanel">
    <h2 class="panel-title">📈 走势图</h2>
    <p class="panel-sub" id="trendSub">第 1-6 位为 0-9，第 7 位为特别号 0-14</p>
    <div class="table-scroll" id="trendScroll">
      <table class="trend-table" id="trendTable"></table>
    </div>
  </section>

  <!-- 频率统计 -->
  <section class="panel" id="freqPanel">
    <h2 class="panel-title">📊 号码出现次数</h2>
    <p class="panel-sub">各号码在每一位出现的次数</p>
    <div class="freq-wrap" id="freqWrap"></div>
  </section>

  <!-- 遗漏统计 -->
  <section class="panel" id="omitPanel">
    <h2 class="panel-title">⏳ 遗漏期数</h2>
    <p class="panel-sub">各号码距离上次出现已间隔多少期（0 表示最近一期刚开出）</p>
    <div class="freq-wrap" id="omitWrap"></div>
  </section>

  <footer class="footer">
    <p>数据来源：中国体育彩票官方开奖数据 · 每日自动更新</p>
    <p class="disclaimer">本工具仅供娱乐与数据参考，不构成任何投注建议，请理性购彩。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
